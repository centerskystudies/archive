title: "Center for Sky Studies"
description: "Mapping the Sky Across Myth and Media"
subtitle: "Bridging research and creative practice to spark imagination, support speculative thought, and trace the cultural life of the sky."
url: "https://skystudies.org"  # ← replace with your actual domain
baseurl: ""
author:
  name: "Guthrie Allen"

# ─── THEME ───────────────────────────────────────────────────────────────────
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "contrast"  # we override everything in main.scss anyway

# ─── PLUGINS ─────────────────────────────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

# ─── COLLECTIONS ─────────────────────────────────────────────────────────────
# _cards/ is your archive. One .md file = one card.
collections:
  cards:
    output: true
    permalink: /cards/:name/

# ─── DEFAULTS ────────────────────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "cards"
    values:
      layout: "card"
      author_profile: false
      read_time: false
      share: false
      related: false
      show_date: true

# ─── ARCHIVES (tag + category pages, auto-generated) ─────────────────────────
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# ─── SEARCH ──────────────────────────────────────────────────────────────────
search: true
search_full_content: true

# ─── EXCLUDE ─────────────────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.sh"
